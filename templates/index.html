<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Dashboard</title>
    <meta http-equiv="refresh" content="2">

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        .card {
            background: #222;
            margin: 20px auto;
            padding: 25px;
            width: 300px;
            border-radius: 12px;
        }

        .value {
            font-size: 40px;
            color: #00ff99;
        }
    </style>
</head>
<body>

<h1>Vehicle Diagnostic Dashboard</h1>

<div class="card">
    Speed
    <div class="value">{{ data.speed }} mph</div>
</div>

<div class="card">
    RPM
    <div class="value">{{ data.rpm }}</div>
</div>

<div class="card">
    Coolant Temp
    <div class="value">{{ data.coolant_temp }} °F</div>
</div>

</body>
</html>
